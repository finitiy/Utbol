<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>IPTV Jonli Efir - Telegram WebApp</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- HLS.js for .m3u8 playback across all browsers -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--tg-theme-bg-color, var(--bg));
      color: var(--tg-theme-text-color, var(--text));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Top Bar */
    header {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 20;
    }

    .channel-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .live-pulse {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--danger);
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    .channel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* Video Player Viewport */
    .player-box {
      flex: 1;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Overlays */
    .loader {
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 15;
      backdrop-filter: blur(4px);
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .error-card {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      max-width: 85%;
      color: #fca5a5;
    }

    .retry-btn {
      margin-top: 12px;
      background: var(--accent);
      color: #0b0f19;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    /* Bottom Control Bar */
    footer {
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .action-btn.primary {
      background: var(--accent);
      color: #042f1a;
      border-color: transparent;
    }

    .action-btn.primary:hover {
      background: #34d399;
    }
  </style>
</head>
<body>
  <header>
    <div class="channel-info">
      <div class="live-pulse">
        <span class="pulse-dot"></span>
        <span>JONLI EFIR</span>
      </div>
      <h1 class="channel-title" id="channel-name">Efir yuklanmoqda...</h1>
    </div>

    <button class="close-btn" id="close-btn" onclick="closeWebApp()">Yopish ✕</button>
  </header>

  <div class="player-box">
    <div id="loader" class="loader">
      <div class="spinner"></div>
      <div class="status-text" id="status-text">Kanal oqimi ulanmoqda (.m3u8)...</div>
    </div>

    <video id="video" playsinline webkit-playsinline controls autoplay></video>
  </div>

  <footer>
    <button class="action-btn" onclick="togglePlayPause()" id="play-pause-btn">
      ⏸ Pauza
    </button>
    <button class="action-btn" onclick="reloadStream()">
      🔄 Qayta yuklash
    </button>
    <button class="action-btn primary" onclick="toggleFullScreen()">
      ⛶ To'liq ekran
    </button>
  </footer>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.enableClosingConfirmation) {
        tg.enableClosingConfirmation();
      }
    }

    function closeWebApp() {
      if (tg && tg.close) {
        tg.close();
      } else {
        window.history.back();
      }
    }

    // Parse URL params
    const params = new URLSearchParams(window.location.search);
    const streamUrl = params.get('url') || 'https://rmtv.akamaized.net/hls/live/2043154/rmtv-en-web/master.m3u8';
    const channelName = params.get('name') || "Sport TV";

    document.getElementById('channel-name').textContent = channelName;

    const video = document.getElementById('video');
    const loader = document.getElementById('loader');
    const statusText = document.getElementById('status-text');
    const playPauseBtn = document.getElementById('play-pause-btn');

    let hlsInstance = null;

    function hideLoader() {
      if (loader) loader.style.display = 'none';
    }

    function showError(msg) {
      if (loader) {
        loader.style.display = 'flex';
        loader.innerHTML = `
          <div class="error-card">
            <div style="font-size:22px; margin-bottom:8px;">⚠️</div>
            <div style="font-weight:700; margin-bottom:4px;">Efirni ochib bo'lmadi</div>
            <div style="font-size:12px; color:#cbd5e1;">${msg}</div>
            <button class="retry-btn" onclick="reloadStream()">Qayta urinish</button>
          </div>
        `;
      }
    }

    function initPlayer() {
      if (!streamUrl) {
        showError("Efir manzili (.m3u8) topilmadi.");
        return;
      }

      if (Hls.isSupported()) {
        if (hlsInstance) {
          hlsInstance.destroy();
        }

        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60,
          manifestLoadingTimeOut: 15000,
          manifestLoadingMaxRetry: 4
        });

        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
          hideLoader();
          video.play().catch(() => {
            console.log("Autoplay unmuted was blocked by browser; ready on user click");
          });
        });

        hlsInstance.on(Hls.Events.ERROR, function (event, data) {
          console.warn("HLS Event Error:", data);
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                statusText.textContent = "Tarmoq qayta ulanmoqda...";
                hlsInstance.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                statusText.textContent = "Media tiklanmoqda...";
                hlsInstance.recoverMediaError();
                break;
              default:
                hlsInstance.destroy();
                showError("Kanal oqimi vaqtincha nofaol yoki internet aloqasi uzildi.");
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // iOS Safari Native HLS
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', function () {
          hideLoader();
          video.play();
        });
        video.addEventListener('error', function () {
          showError("Kanalni yuklashda xatolik yuz berdi.");
        });
      } else {
        showError("Ushbu brauzer HLS (.m3u8) formatini qo'llab-quvvatlamaydi.");
      }
    }

    function togglePlayPause() {
      if (video.paused) {
        video.play();
        playPauseBtn.textContent = "⏸ Pauza";
      } else {
        video.pause();
        playPauseBtn.textContent = "▶ Davom ettirish";
      }
    }

    function reloadStream() {
      location.reload();
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        if (video.requestFullscreen) {
          video.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    video.addEventListener('play', () => {
      playPauseBtn.textContent = "⏸ Pauza";
    });

    video.addEventListener('pause', () => {
      playPauseBtn.textContent = "▶ Davom ettirish";
    });

    // Start player
    initPlayer();
  </script>
</body>
</html>
